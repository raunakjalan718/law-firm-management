spring.application.name=lawfirm-app
server.port=8081

# AWS RDS PostgreSQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:lawfirmdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lawfirm_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.deserialization.accept-empty-string-as-null-object=true

# Security & JWT
app.jwt.secret=${APP_JWT_SECRET:8d4f8f0d9b1c451e8d9d90e4fcf9c9d08d4f8f0d9b1c451e8d9d90e4fcf9c9d0}
app.jwt.expiration-ms=86400000

# AWS S3 / Storage configuration
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.local.path=${APP_STORAGE_LOCAL_PATH:uploads}
aws.s3.bucket=${AWS_S3_BUCKET:lawfirm-documents-010607374213}
aws.region=${AWS_REGION:us-east-1}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
