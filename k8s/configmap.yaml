apiVersion: v1
kind: ConfigMap
metadata:
  name: lawfirm-config
  namespace: lawfirm
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/lawfirmdb"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  APP_STORAGE_LOCAL_PATH: "/app/uploads"
  VITE_API_URL: "http://backend-service:8081"
