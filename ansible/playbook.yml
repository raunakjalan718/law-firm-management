---
- name: Provision and Configure Law Firm Infrastructure
  hosts: app_servers
  become: yes
  vars:
    app_dir: /opt/lawfirm
    docker_compose_version: "v2.24.5"
    git_repo_url: "https://github.com/raunakjalan718/law-firm-management.git"
    app_port: 5173
    backend_port: 8081

  tasks:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - awscli
          - htop
          - ufw
        state: present

    - name: Add Docker official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add remote user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Clone or pull application repository
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: "{{ ansible_user }}"

    - name: Copy production environment file
      copy:
        dest: "{{ app_dir }}/.env"
        content: |
          SPRING_PROFILES_ACTIVE=docker
          SERVER_PORT={{ backend_port }}
          DATABASE_URL=jdbc:postgresql://postgres:5432/lawfirmdb
          DATABASE_USERNAME=postgres
          DATABASE_PASSWORD=SuperSecureLawFirmPassword2026!
          APP_JWT_SECRET=8d4f8f0d9b1c451e8d9d90e4fcf9c9d08d4f8f0d9b1c451e8d9d90e4fcf9c9d0
        mode: '0600'
        owner: "{{ ansible_user }}"

    - name: Build and launch Docker Compose stack
      command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ ansible_user }}"

    - name: Configure UFW firewall rules
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
        - "{{ app_port }}"
        - "{{ backend_port }}"

    - name: Enable UFW firewall
      ufw:
        state: enabled

    - name: Verify backend health
      uri:
        url: "http://localhost:{{ backend_port }}/api/auth/login"
        method: POST
        body_format: json
        body:
          email: "admin@lawfirm.com"
          password: "Admin@123"
        status_code: 200
      register: health_check
      retries: 15
      delay: 5
      until: health_check.status == 200

    - name: Display deployment success message
      debug:
        msg: "Law Firm Management System successfully deployed! Backend is healthy on port {{ backend_port }}."
