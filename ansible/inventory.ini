[app_servers]
# Replace with your AWS EC2 public or private IP addresses
app1.lawfirm.internal ansible_host=10.0.1.100 ansible_user=ubuntu

[db_servers]
db1.lawfirm.internal ansible_host=10.0.2.200 ansible_user=ubuntu

[k8s_nodes]
k8s-master.lawfirm.internal ansible_host=10.0.1.10 ansible_user=ubuntu
